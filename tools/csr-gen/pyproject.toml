[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csr-gen"
version = "1.0.0"
description = "Generate CSR interface artifacts from Markdown register definitions."
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.10"
dependencies = [
  "click>=8.4,<9",
  "markdown-it-py>=4,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.6,<7",
]

[project.scripts]
csr-gen = "csr_gen.cli:main"
csr-gen-gui = "csr_gen_gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

# target black on specific folders, if needed
# include = '''
#   (
#     ^\/build\/\w*\.pyi?$
#     |^\/fpga\-soc\/.*\.pyi?$
#     |^\/scripts\/.*\.pyi?$
#   )
# '''
# 'extend-exclude' excludes files or directories in addition to the defaults

exclude = '''
    /
    (\.direnv|\.eggs|\.git|\.hg
    |\.mypy_cache|\.nox|\.tox|\.venv|venv|\.svn
    |__pypackages__|googletest|linux64)
    /
'''

extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(
  ^/_tools
  | ^/external_tests
  | ^/work
  | ^/build
  | ^/dist
  | ^/src/.*\.egg-info
)
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tests/unittests"]
# Parallel runs: main/private end2end Make targets pass -n $(PYTEST_WORKERS) via pytest-xdist.
# Unit tests (make test-unittests) stay serial for stable coverage.

[tool.coverage.run]
omit = [
  "src/csr_gen/__init__.py",
  "src/csr_gen/__main__.py",
  "src/csr_gen_gui/__init__.py",
  "src/csr_gen_gui/main.py",
  "src/csr_gen_gui/main_window.py",
  "src/csr_gen_gui/range_wizard.py",
  "src/csr_gen_gui/widgets/bitfield_canvas.py",
  "src/csr_gen_gui/widgets/csr_table_widget.py",
  "src/csr_gen_gui/widgets/address_map_widget.py",
]


[tool.flake8]
filename = [
  "**/*.py"
]

count = true
show-source = true
statistics = true

# changes required to make flake8 compatible with black
# https://black.readthedocs.io/en/stable/guides/using_black_with_other_tools.html
# max-length=88, ignore rule E203
max-line-length = 88

# ignores that are applied globally
extend-ignore = [
# W503: Line break occurred before a binary operator, soon to be updated to recommend the opposite style, so current style check is wrong
  "W503",
# E203: Colons should not have any space before them.
#	  conflicts with black, PEP8 says black is correct and flake8 is wrong
#	  https://github.com/psf/black/issues/1437
  "E203",
]

# F error codes (PyFlakes): https://flake8.pycqa.org/en/latest/user/error-codes.html
# E erorr codes (PyCodeStyle): https://pycodestyle.pycqa.org/en/latest/intro.html#error-codes
# W rules (Flake8): https://www.flake8rules.com/

# global ignore patterns
extend-exclude = [
  "venv",
  "work",
  "build",
  "dist",
  "*.egg-info",
]
