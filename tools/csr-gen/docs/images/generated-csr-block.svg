<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
      .inner { fill: #ffffff; stroke: #64748b; stroke-width: 1.2; }
      .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .label { fill: #334155; }
      .muted { fill: #64748b; font-size: 11px; }
      .signal { fill: #1e40af; font-size: 11px; font-family: ui-monospace, monospace; }
    </style>
  </defs>

  <text x="410" y="28" text-anchor="middle" class="title">Generated CSR block (example: csr_registers)</text>
  <text x="410" y="48" text-anchor="middle" class="muted">From specs/golden/example-device - AXI4-Lite slave + per-field ports</text>

  <rect x="24" y="120" width="150" height="160" rx="8" class="box"/>
  <text x="99" y="148" text-anchor="middle" class="label" font-weight="600">AXI4-Lite master</text>
  <text x="99" y="168" text-anchor="middle" class="muted">CPU, DMA, or</text>
  <text x="99" y="184" text-anchor="middle" class="muted">interconnect</text>
  <text x="99" y="212" text-anchor="middle" class="signal">s_axi_*</text>
  <text x="99" y="232" text-anchor="middle" class="muted">addr, data, strobes</text>
  <text x="99" y="252" text-anchor="middle" class="muted">read / write channels</text>

  <rect x="230" y="72" width="360" height="256" rx="10" class="box"/>
  <text x="410" y="100" text-anchor="middle" class="label" font-weight="700">module csr_registers</text>
  <text x="410" y="120" text-anchor="middle" class="muted">parameter BASE_ADDR - byte offset in system map</text>

  <rect x="252" y="136" width="316" height="56" rx="6" class="inner"/>
  <text x="410" y="158" text-anchor="middle" class="label">AXI4-Lite slave interface</text>
  <text x="410" y="178" text-anchor="middle" class="muted">Decode awaddr/araddr - BASE_ADDR; byte strobes</text>

  <rect x="252" y="204" width="150" height="108" rx="6" class="inner"/>
  <text x="327" y="228" text-anchor="middle" class="label">CTRL @ 0x00</text>
  <text x="327" y="248" text-anchor="middle" class="signal">enable, mode</text>
  <text x="327" y="268" text-anchor="middle" class="muted">rw fields</text>
  <text x="327" y="296" text-anchor="middle" class="muted">always_ff updates</text>

  <rect x="418" y="204" width="150" height="108" rx="6" class="inner"/>
  <text x="493" y="228" text-anchor="middle" class="label">EVENTS @ 0x04</text>
  <text x="493" y="248" text-anchor="middle" class="signal">pending[7:0]</text>
  <text x="493" y="268" text-anchor="middle" class="muted">rw1c field</text>
  <text x="493" y="296" text-anchor="middle" class="muted">hardware + SW access</text>

  <rect x="646" y="120" width="150" height="160" rx="8" class="box"/>
  <text x="721" y="148" text-anchor="middle" class="label" font-weight="600">Surrounding RTL</text>
  <text x="721" y="168" text-anchor="middle" class="muted">Your peripheral or</text>
  <text x="721" y="184" text-anchor="middle" class="muted">control logic</text>
  <text x="721" y="212" text-anchor="middle" class="signal">ctrl_enable_i/o</text>
  <text x="721" y="232" text-anchor="middle" class="signal">ctrl_mode_i/o</text>
  <text x="721" y="252" text-anchor="middle" class="signal">events_pending_i/o</text>

  <line x1="174" y1="190" x2="228" y2="190" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="228" y1="210" x2="174" y2="210" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="568" y1="240" x2="644" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="644" y1="250" x2="568" y2="270" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="201" y="182" class="muted">writes</text>
  <text x="201" y="222" class="muted">reads</text>
  <text x="606" y="228" class="muted">outputs</text>
  <text x="606" y="278" class="muted">inputs</text>

  <text x="410" y="368" text-anchor="middle" class="muted">Software accesses registers over AXI; field *_i / *_o ports tie CSR flops to your design</text>
</svg>
